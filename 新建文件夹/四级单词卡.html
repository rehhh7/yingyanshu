<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>四级单词卡</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body { font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; background:#1a1d29; color:#f0f2f8; min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:12px; }
.bar { width:100%; max-width:480px; display:flex; align-items:center; gap:6px; margin-bottom:10px; flex-wrap:wrap; }
select, .bar button { background:#2a2f42; color:#f0f2f8; border:1px solid #3a4058; border-radius:8px; padding:6px 9px; font-size:13.5px; }
.mode button.on { background:#4f6ef7; border-color:#4f6ef7; }
.progress { margin-left:auto; font-size:14px; color:#9aa3c0; white-space:nowrap; }
.cardwrap { width:100%; max-width:480px; height:60vh; min-height:380px; perspective:1200px; }
.card { width:100%; height:100%; position:relative; transform-style:preserve-3d; transition:transform .5s; cursor:pointer; }
.card.flipped { transform:rotateY(180deg); }
.face { position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden; border-radius:18px; background:linear-gradient(160deg,#252b40,#1e2333); border:1px solid #3a4058; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; overflow-y:auto; }
.back { transform:rotateY(180deg); justify-content:flex-start; }
.word { font-size:38px; font-weight:700; letter-spacing:1px; display:flex; align-items:center; gap:10px; }
.phon { color:#8b93b8; font-size:17px; margin-top:10px; }
.daytag { position:absolute; top:14px; left:16px; font-size:12px; color:#565f80; }
.hint { color:#565f80; font-size:13px; margin-top:26px; }
.spk { background:none; border:none; cursor:pointer; font-size:20px; padding:2px; }
.sec { width:100%; margin-top:14px; text-align:left; }
.sec h3 { font-size:14px; color:#7f8ab0; margin-bottom:6px; border-left:3px solid #4f6ef7; padding-left:7px; }
.item { display:flex; align-items:flex-start; gap:6px; padding:6px 2px; border-bottom:1px dashed #333b55; font-size:15px; }
.item .w { font-weight:600; color:#ffd97a; white-space:nowrap; }
.item .n { color:#c6cde6; font-size:13.5px; line-height:1.5; }
.mean { font-size:19px; font-weight:600; color:#fff; margin-top:14px; }
.badges { margin-top:10px; display:flex; gap:8px; }
.badge { font-size:13px; padding:3px 12px; border-radius:20px; }
.badge.k { background:#123524; color:#5eeaa0; }
.badge.s { background:#3a2a12; color:#ffb35c; }
.controls { width:100%; max-width:480px; display:flex; gap:10px; margin-top:14px; }
.controls button { flex:1; padding:13px 0; border-radius:12px; border:none; font-size:16px; font-weight:600; cursor:pointer; }
#no { background:#4a2430; color:#ff8fa3; }
#flip { background:#2a2f42; color:#c6cde6; border:1px solid #3a4058; }
#yes { background:#1d3a2a; color:#5eeaa0; }
.nav { width:100%; max-width:480px; display:flex; justify-content:space-between; margin-top:10px; }
.nav button { background:none; border:1px solid #3a4058; color:#c6cde6; border-radius:10px; padding:9px 22px; font-size:15px; cursor:pointer; }
#addBtn { position:fixed; right:16px; bottom:20px; width:52px; height:52px; border-radius:50%; border:none; background:#4f6ef7; color:#fff; font-size:28px; cursor:pointer; box-shadow:0 4px 14px rgba(79,110,247,.4); z-index:5; }
#modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,.7); z-index:10; align-items:center; justify-content:center; padding:20px; }
#modal.show { display:flex; }
.form { background:#222740; border-radius:16px; padding:20px; width:100%; max-width:420px; max-height:85vh; overflow-y:auto; }
.form h2 { font-size:18px; margin-bottom:12px; }
.form input, .form textarea { width:100%; background:#1a1d29; border:1px solid #3a4058; border-radius:8px; color:#f0f2f8; padding:9px; margin-bottom:9px; font-size:15px; }
.form textarea { height:56px; resize:vertical; }
.form .row { display:flex; gap:8px; }
.form .row button { flex:1; padding:11px; border-radius:10px; border:none; font-size:15px; font-weight:600; cursor:pointer; }
#save { background:#1d3a2a; color:#5eeaa0; }
#cancel { background:#3a2430; color:#ff8fa3; }
.small { font-size:12px; color:#7f8ab0; margin-bottom:8px; }
/* 单词表 */
#listView { width:100%; max-width:480px; display:none; }
#listView.show { display:block; }
.listbar { display:flex; gap:8px; margin-bottom:10px; align-items:center; }
.listbar button { background:#2a2f42; color:#f0f2f8; border:1px solid #3a4058; border-radius:8px; padding:7px 14px; font-size:14px; }
.listbar button.on { background:#4f6ef7; border-color:#4f6ef7; }
#listInfo { margin-left:auto; font-size:13px; color:#9aa3c0; }
.daygroup { margin:14px 0 6px; font-size:13px; color:#7f8ab0; border-left:3px solid #4f6ef7; padding-left:8px; }
.row2 { display:flex; align-items:center; gap:8px; padding:9px 6px; border-bottom:1px solid #262c42; }
.row2 .lw { font-size:17px; font-weight:600; display:flex; align-items:center; gap:7px; cursor:pointer; min-width:96px; }
.row2 .lm { color:#aab3d0; font-size:13.5px; flex:1; line-height:1.4; }
.row2 .star { font-size:20px; background:none; border:none; cursor:pointer; padding:4px 6px; }
.row2.sheng .lw { color:#ffb35c; }
</style>
</head>
<body>
<div class="bar">
  <div class="mode"><button id="mCard" class="on">卡片</button><button id="mList">单词表</button></div>
  <select id="filter">
    <option value="all">全部</option>
    <option value="new">生词</option>
    <option value="known">已认识</option>
    <option value="custom">我添加的</option>
  </select>
  <select id="daySel"></select>
  <button id="shuffle">乱序:关</button>
  <button id="expBtn">备份</button>
  <button id="impBtn">导入</button>
  <input type="file" id="impFile" accept=".json" style="display:none">
  <div class="progress" id="progress"></div>
</div>

<div class="cardwrap" id="cardwrap"><div class="card" id="card">
  <div class="face front">
    <div class="daytag" id="dayTag"></div>
    <div class="word"><span id="w"></span><button class="spk" onclick="event.stopPropagation();speak(cur().w)">🔊</button></div>
    <div class="phon" id="p"></div>
    <div class="hint">点击卡片查看释义</div>
  </div>
  <div class="face back">
    <div class="daytag" id="dayTag2"></div>
    <div class="mean" id="m"></div>
    <div class="badges"><span class="badge k" id="kTag" style="display:none">已认识 ✓</span><span class="badge s" id="sTag" style="display:none">⭐ 生词</span></div>
    <div class="sec" id="synSec"><h3>近义词 · 用法区别</h3><div id="synList"></div></div>
    <div class="sec" id="simSec"><h3>形近词 · 别混</h3><div id="simList"></div></div>
  </div>
</div></div>

<div id="listView">
  <div class="listbar">
    <button id="langT" class="on">中英对照</button>
    <button id="langE">纯英文</button>
    <span id="listInfo"></span>
  </div>
  <div id="wordList"></div>
</div>

<div class="controls" id="ctrl">
  <button id="no">✗ 不认识</button>
  <button id="flip">翻转</button>
  <button id="yes">✓ 认识</button>
</div>
<div class="nav" id="navb">
  <button id="prev">← 上一个</button>
  <button id="next">下一个 →</button>
</div>

<button id="addBtn">＋</button>
<div id="modal"><div class="form">
  <h2>添加新单词</h2>
  <div class="small">近义词和形近词每行一个，格式：单词 | 说明（可不填）</div>
  <input id="inW" placeholder="单词（必填）">
  <input id="inP" placeholder="音标（可留空）">
  <input id="inM" placeholder="中文释义（必填）">
  <textarea id="inSyn" placeholder="近义词，每行一个：&#10;insignificant | 侧重重要性小"></textarea>
  <textarea id="inSim" placeholder="形近词，每行一个：&#10;stuff | staff是人 stuff是物"></textarea>
  <div class="row"><button id="cancel">取消</button><button id="save">保存</button></div>
</div></div>

<script>
const BUILT = [{"w": "trivial", "p": "/ˈtrɪviəl/", "m": "adj. 琐碎的；不重要的", "syn": [{"w": "insignificant", "n": "insignificant 侧重重要性、价值小到可忽略；trivial 指日常琐事不值得关注"}], "sim": [{"w": "trifle", "n": "同源词 n. 琐事；少量"}], "day": "手写一"}, {"w": "occurrence", "p": "/əˈkɜːrəns/", "m": "n. 发生；发生的事情", "syn": [{"w": "incident", "n": "occurrence 泛指发生的事（中性）；incident 常指不寻常的插曲、事端"}], "sim": [{"w": "currency", "n": "n. 货币；流通（词形有点像，注意区分）"}], "day": "手写一"}, {"w": "precaution", "p": "/prɪˈkɔːʃn/", "m": "n. 预防措施", "syn": [{"w": "prevention", "n": "precaution 侧重事先的防备动作（take precautions）；prevention 侧重阻止的结果"}], "sim": [{"w": "caution", "n": "n./v. 小心；告诫"}], "day": "手写一"}, {"w": "prevention", "p": "/prɪˈvenʃn/", "m": "n. 预防；阻止", "syn": [{"w": "precaution", "n": "见 precaution 卡：precaution 重动作（事先防备），prevention 重结果（阻止发生）"}], "sim": [{"w": "precaution", "n": "形近，词义见左"}], "day": "手写一"}, {"w": "faint", "p": "/feɪnt/", "m": "adj. 微弱的；眩晕的  v. 昏厥", "syn": [{"w": "dim", "n": "faint 可指声音、光线、希望微弱，也可指人要晕倒；dim 只指光线昏暗、记忆模糊"}], "sim": [{"w": "feint", "n": "n. 佯攻（词源不同）"}], "day": "手写一"}, {"w": "staff", "p": "/stɑːf/", "m": "n. 全体职员；棍棒  v. 为…配备人员", "syn": [{"w": "personnel", "n": "staff 是集合名词，指某机构全体职员；personnel 更正式，常指人事部门/全体人员"}], "sim": [{"w": "stuff", "n": "n. 东西；材料（staff 是人，stuff 是物）"}], "day": "手写一"}, {"w": "crew", "p": "/kruː/", "m": "n. 全体船员/机组人员；一队人", "syn": [{"w": "staff", "n": "crew 指船员、机组、剧组等一班人；staff 指机构的职员"}], "sim": [{"w": "chew", "n": "v. 咀嚼"}], "day": "手写一"}, {"w": "intensity", "p": "/ɪnˈtensəti/", "m": "n. 强烈；强度", "syn": [{"w": "tension", "n": "intensity 指强度、烈度；tension 指紧张状态/张力"}], "sim": [{"w": "density", "n": "n. 密度（长得像）"}], "day": "手写一"}, {"w": "bail", "p": "/beɪl/", "m": "n. 保释金  v. 保释；舀水", "syn": [], "sim": [{"w": "bait", "n": "n. 饵；bait 与 bail 元音不同"}], "day": "手写一"}, {"w": "trial", "p": "/ˈtraɪəl/", "m": "n. 审判；试验；试用", "syn": [{"w": "experiment", "n": "trial 指试用、试验以检验是否可行；experiment 指科学实验"}], "sim": [{"w": "trail", "n": "n. 小径；痕迹（trial 审判，trail 踪迹）"}], "day": "手写一"}, {"w": "torture", "p": "/ˈtɔː let knownSet = new Set(JSON.parse(store.get('cet4_known')||'[]'));
let sheng = new Set(JSON.parse(store.get('cet4_sheng')||'[]'));
let shuffled=false, idx=0, mode='card', zhMode=true;
const $=id=>document.getElementById(id);

function allWords(){ return BUILT.concat(custom); }
function save(){ store.set('cet4_custom',JSON.stringify(custom)); store.set('cet4_known',JSON.stringify([...knownSet])); store.set('cet4_sheng',JSON.stringify([...sheng])); }
function deck(){
  let d=allWords().map((w,i)=>({...w,ci:i}));
  const f=$('filter').value, day=daySel.value;
  if(f==='known') d=d.filter(x=>knownSet.has(x.w));
  if(f==='new') d=d.filter(x=>sheng.has(x.w));
  if(f==='custom') d=d.filter(x=>x.custom);
  if(day) d=d.filter(x=>x.day===day);
  if(shuffled) d=d.sort(()=>Math.random()-.5);
  return d;
}
function cur(){ const d=deck(); return d.length? d[idx % d.length] : null; }

let voices=[];
function loadVoices(){ voices=speechSynthesis.getVoices(); }
loadVoices(); speechSynthesis.onvoiceschanged=loadVoices;
function speak(t){
  const u=new SpeechSynthesisUtterance(t); u.lang='en-US'; u.rate=0.88;
  const v=voices.find(v=>v.lang.startsWith('en')&&/Google|Natural|Samantha|Zira/i.test(v.name))||voices.find(v=>v.lang.startsWith('en'));
  if(v)u.voice=v;
  speechSynthesis.cancel(); speechSynthesis.speak(u);
}

function render(){
  if(mode==='list'){ renderList(); return; }
  const d=deck(), c=cur();
  if(!c){ $('w').textContent='（空）'; $('p').textContent=''; $('m').textContent=''; $('synList').innerHTML=''; $('simList').innerHTML=''; $('progress').textContent='0/0'; return; }
  if(idx>=d.length) idx=0;
  $('card').classList.remove('flipped');
  setTimeout(()=>{
    $('w').textContent=c.w; $('p').textContent=c.p||'';
    $('m').textContent=c.m;
    $('dayTag').textContent=c.day||''; $('dayTag2').textContent=c.day||'';
    $('synList').innerHTML=(c.syn||[]).map(s=>`<div class="item"><button class="spk" onclick="event.stopPropagation();speak('${s.w}')">🔊</button><span class="w">${s.w}</span><span class="n">${s.n||''}</span></div>`).join('');
    $('simList').innerHTML=(c.sim||[]).map(s=>`<div class="item"><button class="spk" onclick="event.stopPropagation();speak('${s.w}')">🔊</button><span class="w">${s.w}</span><span class="n">${s.n||''}</span></div>`).join('');
    $('synSec').style.display=(c.syn&&c.syn.length)?'block':'none';
    $('simSec').style.display=(c.sim&&c.sim.length)?'block':'none';
    $('kTag').style.display=knownSet.has(c.w)?'inline-block':'none';
    $('sTag').style.display=sheng.has(c.w)?'inline-block':'none';
  },120);
  $('progress').textContent=(idx+1)+' / '+d.length;
}

function renderList(){
  const d=deck();
  $('listInfo').textContent=d.length+' 词';
  let html='', lastDay=null;
  d.forEach((c)=>{
    if(c.day!==lastDay){ html+='<div class="daygroup">'+ (c.day||'其他') +'</div>'; lastDay=c.day; }
    const star=sheng.has(c.w)?'⭐':'☆';
    html+=`<div class="row2${sheng.has(c.w)?' sheng':''}">
      <span class="lw" onclick="speak('${c.w}')">${c.w}<button class="spk">🔊</button></span>
      <span class="lm" style="display:${zhMode?'inline':'none'}">${c.m||''}</span>
      <button class="star" data-w="${c.w}">${star}</button></div>`;
  });
  $('wordList').innerHTML=html||'<div style="color:#565f80;padding:30px;text-align:center">没有单词</div>';
  document.querySelectorAll('.star').forEach(b=>{
    b.onclick=()=>{ const w=b.dataset.w;
      if(sheng.has(w)){ sheng.delete(w); b.textContent='☆'; b.parentElement.classList.remove('sheng'); }
      else { sheng.add(w); knownSet.delete(w); b.textContent='⭐'; b.parentElement.classList.add('sheng'); }
      save();
      if($('filter').value==='new'||$('filter').value==='known') renderList();
    };
  });
  $('progress').textContent=d.length+' 词';
}
function go(n){ const d=deck(); if(!d.length)return; idx=(idx+n+d.length)%d.length; render(); }
function setMode(m){
  mode=m;
  $('mCard').classList.toggle('on',m==='card');
  $('mList').classList.toggle('on',m==='list');
  $('cardwrap').style.display=m==='card'?'block':'none';
  $('ctrl').style.display=m==='card'?'flex':'none';
  $('navb').style.display=m==='card'?'flex':'none';
  $('listView').classList.toggle('show',m==='list');
  idx=0; render();
}

$('mCard').onclick=()=>setMode('card');
$('mList').onclick=()=>setMode('list');
$('langT').onclick=()=>{ zhMode=true; $('langT').classList.add('on'); $('langE').classList.remove('on'); renderList(); };
$('langE').onclick=()=>{ zhMode=false; $('langE').classList.add('on'); $('langT').classList.remove('on'); renderList(); };
$('card').onclick=()=>$('card').classList.toggle('flipped');
$('flip').onclick=()=>$('card').classList.toggle('flipped');
$('next').onclick=()=>go(1);
$('prev').onclick=()=>go(-1);
$('yes').onclick=()=>{ const c=cur(); if(c){ knownSet.add(c.w); sheng.delete(c.w); save(); go(1);} };
$('no').onclick=()=>{ const c=cur(); if(c){ sheng.add(c.w); knownSet.delete(c.w); save(); go(1);} };
$('shuffle').onclick=()=>{ shuffled=!shuffled; $('shuffle').textContent='乱序:'+(shuffled?'开':'关'); idx=0; render(); };
$('filter').onchange=()=>{ idx=0; render(); };
daySel.onchange=()=>{ idx=0; render(); };

document.addEventListener('keydown',e=>{
  if(mode!=='card')return;
  if(e.key==='ArrowRight')go(1); if(e.key==='ArrowLeft')go(-1);
  if(e.key===' '){e.preventDefault();$('card').classList.toggle('flipped');}
});
let tx=0;
$('card').addEventListener('touchstart',e=>tx=e.touches[0].clientX,{passive:true});
$('card').addEventListener('touchend',e=>{ const dx=e.changedTouches[0].clientX-tx; if(Math.abs(dx)>60)go(dx<0?1:-1); },{passive:true});

$('addBtn').onclick=()=>$('modal').classList.add('show');
$('cancel').onclick=()=>$('modal').classList.remove('show');
function parseLines(t){ return t.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{ const [w,...r]=l.split('|'); return {w:w.trim(),n:r.join('|').trim()}; }); }
$('save').onclick=()=>{
  const w=$('inW').value.trim(); if(!w)return;
  custom.push({w, p:$('inP').value.trim(), m:$('inM').value.trim()||'（未填释义）', syn:parseLines($('inSyn').value), sim:parseLines($('inSim').value), day:'我添加的', custom:true});
  save(); $('modal').classList.remove('show');
  ['inW','inP','inM','inSyn','inSim'].forEach(i=>$(i).value='');
  $('filter').value='custom'; idx=custom.length-1; render();
};
$('expBtn').onclick=()=>{
  const blob=new Blob([JSON.stringify({custom,known:[...knownSet],sheng:[...sheng]})],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='单词卡备份.json'; document.body.appendChild(a); a.click(); a.remove();
};
$('impBtn').onclick=()=>$('impFile').click();
$('impFile').onchange=e=>{
  const f=e.target.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=()=>{ try{ const d=JSON.parse(r.result);
    if(Array.isArray(d.custom))custom=d.custom;
    if(Array.isArray(d.known))knownSet=new Set(d.known);
    if(Array.isArray(d.sheng))sheng=new Set(d.sheng);
    save(); idx=0; render(); alert('导入成功');
  }catch(err){ alert('导入失败：不是有效的备份文件'); } };
  r.readAsText(f); e.target.value='';
};
render();
</script>
</body>
</html>
